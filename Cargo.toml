[package]
name = "shard-drain"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shell-words = "1.1.1"
shellexpand = "3.1.2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "time", "io-util"] }
tokio-postgres = "0.7.18"
toml = "1.2.0"
